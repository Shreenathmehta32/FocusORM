<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>FocusORM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .status {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 14px;
      font-weight: 600;
    }

    .status-domain {
      color: #818cf8;
    }

    .tracking-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .tracking-on {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .tracking-off {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .dot-green {
      background: #4ade80;
    }

    .dot-red {
      background: #f87171;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }

    .btn-toggle {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }

    .btn-toggle:hover {
      background: #334155;
    }

    .btn-dashboard {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .btn-dashboard:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">⚡</div>
    <h1>FocusORM</h1>
  </div>

  <div class="status">
    <div class="status-label">Current Site</div>
    <div class="status-value status-domain" id="currentDomain">—</div>
  </div>

  <div class="status">
    <div class="status-label">Tracking Status</div>
    <div id="trackingStatus">
      <span class="tracking-badge tracking-on">
        <span class="dot dot-green"></span>
        Active
      </span>
    </div>
  </div>

  <button class="btn btn-toggle" id="toggleBtn">Pause Tracking</button>
  <button class="btn btn-dashboard" id="dashboardBtn">Open Dashboard</button>

  <script src="popup.js"></script>
</body>

</html>
